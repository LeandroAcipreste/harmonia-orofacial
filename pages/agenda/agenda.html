<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Agenda do dia · Harmonia Orofacial</title>

  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon-180.png" />

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="agenda.css" />
</head>

<body class="fundo-interno">

<main class="pagina erp agenda">

  <header class="erp__topo">
    <div class="erp__marca">
      <img class="erp__marca-img" src="../../assets/favicon-180.png" alt="" width="180" height="180" />
      <div>
        <p class="erp__marca-nome">HARMONIA OROFACIAL</p>
        <p class="erp__marca-tipo" id="erp-quem">CLÍNICA ODONTOLÓGICA</p>
      </div>
    </div>

    <button class="erp__sair" type="button" id="erp-sair">Sair</button>
  </header>

  <nav class="navegar" aria-label="Telas do sistema">
    <a class="navegar__link esta-aqui" href="agenda.html" aria-current="page">Agenda do dia</a>
    <a class="navegar__link" href="../pacientes/pacientes.html">Pacientes</a>
  </nav>

  <h1 class="erp__titulo">Agenda do dia</h1>

  <div class="agenda__navegacao">
    <button class="agenda__seta" type="button" id="agenda-anterior" aria-label="Dia anterior">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
    </button>

    <label class="agenda__data">
      <span class="agenda__data-rotulo" id="agenda-extenso">—</span>
      <input class="agenda__data-campo" type="date" id="agenda-dia" aria-label="Escolher o dia" />
    </label>

    <button class="agenda__seta" type="button" id="agenda-proximo" aria-label="Próximo dia">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
    </button>

    <button class="agenda__hoje" type="button" id="agenda-hoje">Hoje</button>
  </div>

  <p class="agenda__resumo" id="agenda-resumo" role="status"></p>

  <ol class="lista" id="agenda-lista"></ol>

  <p class="vazio" id="agenda-vazio" hidden>Nenhuma avaliação marcada para este dia.</p>
  <p class="erro" id="agenda-erro" role="alert" hidden></p>

  <div id="painel"></div>

</main>

<template id="modelo-agendamento">
  <li>
    <button class="lista__botao" type="button">
      <span class="agenda__hora"></span>
      <span class="lista__quem">
        <span class="lista__nome"></span>
        <span class="lista__detalhe"></span>
      </span>
      <span class="selo"></span>
    </button>
  </li>
</template>

<script type="module" src="agenda.js"></script>

</body>
</html>
